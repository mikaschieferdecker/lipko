name: Deploy Website to All-Inkl

# Basiert auf dem erprobten LFTP-Setup (All-Inkl-kompatibel: ssl-allow no,
# passive-mode). Dieses Projekt ist statisches HTML ohne build.js – daher
# wird dist/ hier direkt aus den Website-Dateien zusammengestellt, statt
# einen Build laufen zu lassen. Die Upload-Zeile bleibt unverändert.
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    z. B. wXXYYYZZ.kasserver.com  (ohne ftp:// )
#   FTP_USERNAME  FTP-Login der Subdomain
#   FTP_PASSWORD  FTP-Passwort
# Der FTP-User sollte direkt im Subdomain-Ordner landen (mirror-Ziel ist ./).

on:
  push:
    branches:
      - claude/design-project-implementation-43qg41
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy HTML Files
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Website nach dist/ zusammenstellen
      run: |
        mkdir -p dist
        cp index.html ueber-uns.html leistungen.html expertise.html faq.html kontakt.html \
           styles.css main.js dist/

    - name: 🚀 Upload via LFTP (All-Inkl kompatibel)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        # Installiere lftp
        sudo apt-get update && sudo apt-get install -y lftp

        # Übertrage die Dateien mit speziellen All-Inkl Einstellungen
        lftp -e "
          set ftp:ssl-allow no;
          set ftp:passive-mode true;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          mirror -R --delete --reverse --no-perms \
            ./dist/ ./;
          quit
        "
